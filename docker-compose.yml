# Local Postgres for development. `docker compose up -d` to start, `docker compose down` to stop.
# Data persists in the named volume across restarts; `docker compose down -v` wipes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: momentum
      POSTGRES_DB: momentum
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum -d momentum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
